    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
          "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: #000;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .extra-wide-container {
        display: flex;
        flex-wrap: wrap;
        width: calc(100vw + 64px);
        filter: hue-rotate(90deg) contrast(200%) brightness(150%);
      }

      .row {
        display: flex;
      }

      .row img {
        width: 64px;
        height: 64px;
        background-size: cover;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        pointer-events: none;
      }
    </style>

  <body>
    <div class="container" aria-hidden="true">
      <div class="extra-wide-container" id="background"></div>
    </div>

    <script>
      (function () {
        var IMAGE_SIZE_SQUARE_ROOT = 64;
        var AMOUNT_OF_IMAGES = 3;

        var imageSizeSmaller = Math.floor(IMAGE_SIZE_SQUARE_ROOT / 2 / 2 / 2);
        var RANDOM_SOURCES = ["https://picsum.photos/" + imageSizeSmaller];

        var currentTimestamp = Number(new Date());

        var colors = [];
        for (var c = 0; c < AMOUNT_OF_IMAGES; c++) {
          colors.push("#" + Math.random().toString(16).slice(2, 8));
        }

        var images = [];
        for (var i = 0; i < AMOUNT_OF_IMAGES; i++) {
          images.push(
            RANDOM_SOURCES[i % RANDOM_SOURCES.length] +
              "?r=" +
              currentTimestamp +
              "_" +
              i,
          );
        }

        var background = document.getElementById("background");

        function render() {
          var amountOfItemsPerRow = Math.ceil(
            window.innerWidth / IMAGE_SIZE_SQUARE_ROOT,
          );
          var amountOfItemsPerCol = Math.ceil(
            window.innerHeight / IMAGE_SIZE_SQUARE_ROOT,
          );

          var fragment = document.createDocumentFragment();

          for (var row = 0; row < amountOfItemsPerCol; row++) {
            var rowElement = document.createElement("div");
            rowElement.className = "row";

            for (var n = 0; n < amountOfItemsPerRow; n++) {
              var tile = document.createElement("img");
              tile.style.backgroundColor = colors[(row + n) % colors.length];
              tile.src = images[(row + n) % images.length];
              rowElement.appendChild(tile);
            }

            fragment.appendChild(rowElement);
          }

          background.innerHTML = "";
          background.appendChild(fragment);
        }

        render();
        window.addEventListener("resize", render);
      })();
    </script>
  </body>
